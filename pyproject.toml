[project]
name = "pch-astral"
version = "0.1.0"
description = "PCH-ASTRAL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "treeswift>=1.1.45",
    "jinja2>=3.1.6",
    "seaborn>=0.13.2",
    "numpy>=2.4.4",
    "matplotlib>=3.10.9",
    "polars>=1.40.1",
    "pandas>=3.0.3",
    "scipy>=1.17.1",
    "biopython>=1.87",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "shortuuid>=1.0.13",
    "ty>=0.0.35",
    "dataclasses>=0.8",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "typer>=0.26.7",
]

[project.scripts]
pch = "scripts.py.cli.main:app"

[tool.ty.rules]
possibly-missing-submodule = "ignore"

[tool.ruff.lint]
ignore = [
    "E741" # ambiguous variable name
]
