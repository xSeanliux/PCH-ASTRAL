# Smoke test for the CAMUS wiring: runs `pch experiment inference` so runCAMUS.sh
# (a stub) is invoked per dataset. Sim data is copied from experiments/smoke_test.
#
# guide_trees is [true_tree] here so CAMUS has no upstream dependency and the stub
# runs self-contained. The other supported guide is astral3, which additionally
# needs astral_3 enabled (it becomes a scheduler dependency):
#   camus:
#     guide_trees: [astral3, true_tree]
# mp and ga are rejected at config load — CAMUS requires a rooted binary
# constraint tree. See spec/camus/inference.md.
experiment_folder: experiments/camus_smoke
simulation:
  n_taxa: 30
  n_horizontal_edges:
    - 0
  n_trees: 1
  n_replicas: 4
  base_config_dir: data/base_configs
  base_trees_file: data/trees.txt
  base_networks_dir: data/base_networks
  simulation_params:
    - poly: high
      homoplasy_factor: 0.1
      tree_height: 4
      n_chars: 80

methods:
  camus:
    guide_trees:
      - true_tree
