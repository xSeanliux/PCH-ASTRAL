# Smoke test for TOB-QMC: networks with 1 and 2 contact events. No dependencies.
experiment_folder: experiments/tob_qmc_smoke
simulation:
  n_taxa: 30
  n_horizontal_edges:
    - 1
    - 2
  n_trees: 1
  n_replicas: 2
  base_config_dir: data/base_configs
  base_trees_file: data/trees.txt
  base_networks_dir: data/base_networks
  simulation_params:
    - poly: high
      homoplasy_factor: 0.1
      tree_height: 4
      n_chars: 80

methods:
  tob_qmc: {} # no knobs: TREE-QMC's defaults
