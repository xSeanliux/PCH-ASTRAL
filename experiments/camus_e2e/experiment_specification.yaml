# End-to-end smoke: 2 model trees, 30 taxa + OUT, one condition, 1 replica, h = 1 and 2.
# ASTRAL3 heuristic on the quartets alone; CAMUS on its tree and the true tree.
experiment_folder: experiments/camus_e2e
simulation:
  n_taxa: 30
  outgroup_label: OUT
  n_horizontal_edges:
    - 1
    - 2
  n_trees: 2
  n_replicas: 1
  base_config_dir: data/base_configs
  base_trees_file: data/trees.txt
  base_networks_dir: data/base_networks
  simulation_params:
    - poly: high
      homoplasy_factor: 0.1
      tree_height: 4
      n_chars: 80

methods:
  astral_3:
    is_exact: false
    bipartition_strategies: []
  camus:
    outgroup_label: OUT
    guide_trees:
      - pch_astral3
      - true_tree
