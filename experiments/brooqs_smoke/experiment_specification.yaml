# Smoke test for BROOQS: networks with 1 and 2 contact events.
# BROOQS expands the tob_qmc tree of blobs (a scheduler dependency) and needs the outgroup.
experiment_folder: experiments/brooqs_smoke
simulation:
  n_taxa: 30
  outgroup_label: OUT # the tree of blobs and the network are rooted on it
  n_horizontal_edges:
    - 1
    - 2
  n_trees: 1
  n_replicas: 2
  base_config_dir: data/base_configs
  base_trees_file: data/trees.txt
  base_networks_dir: data/base_networks
  simulation_params:
    - poly: high
      homoplasy_factor: 0.1
      tree_height: 4
      n_chars: 80

methods:
  tob_qmc: {} # tree of blobs; no knobs: TREE-QMC's defaults
  brooqs: {} # no knobs: one hybrid per blob
